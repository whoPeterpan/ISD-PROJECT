<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculty App</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">FA</div><div><h1>Faculty App</h1><p>Simple Self-Appraisal System</p></div></header>
<nav><button class="active" data-view="form">Faculty Form</button><button data-view="admin">Admin Records</button></nav><main>
<section id="form" class="view"><h2>Self-Appraisal Form</h2><p class="muted">Enter your details and submit your appraisal.</p><form id="appraisal"><div class="grid">
<label>Faculty Name *<input name="name" required></label><label>Employee Code *<input name="employeeCode" required></label>
<label>Department<input name="department"></label><label>Academic Year *<input name="year" placeholder="2025–2026" required></label>
<label class="wide">Teaching & Lectures<textarea name="teaching" rows="3"></textarea></label><label class="wide">Research Publications<textarea name="publications" rows="3"></textarea></label>
<label class="wide">Events / Seminars<textarea name="events" rows="2"></textarea></label><label class="wide">Projects<textarea name="projects" rows="2"></textarea></label></div>
<button class="primary">Submit Appraisal</button> <span id="success"></span></form></section>
<section id="admin" class="view hidden"><h2>Admin Records</h2><p class="muted">Search, sort and export appraisal records.</p><div class="tools"><input id="search" placeholder="Search name or employee code"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Name A–Z</option><option value="code">Employee code</option></select></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Employee Code</th><th>Year</th><th>Submitted</th><th>PDF</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="muted">No records submitted yet.</p></section></main><footer>Basic offline prototype · Records stay on this Mac</footer><script src="renderer.js"></script></body></html>
